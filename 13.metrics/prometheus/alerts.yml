groups:
  - name: shop
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not answering"

      - alert: HighErrorRate
        expr: |
          sum(rate(shop_http_requests_total{status=~"5.."}[30s]))
            / sum(rate(shop_http_requests_total[30s])) > 0.1
        for: 15s
        labels: { severity: warning }
        annotations:
          summary: "More than 10% of requests are failing"

      - alert: ContainerNearMemoryLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.8
        for: 15s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} is above 80% of its memory limit"
