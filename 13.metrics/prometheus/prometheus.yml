global:
  scrape_interval: 5s          # how often to collect numbers (15s-60s is more usual)
  evaluation_interval: 5s      # how often to check the alert rules

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus       # Prometheus watching itself
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: shop-api         # our own application
    static_configs:
      - targets: ["api:8000"]

  - job_name: cadvisor         # every container's CPU, memory, network, disk
    static_configs:
      - targets: ["cadvisor:8080"]
